name: Publish to npm

# 触发方式：
# 1) 推送 v* 标签（推荐）：git tag v1.0.1 && git push origin v1.0.1
# 2) 手动：仓库 Actions 页面 → 本 workflow → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # OIDC 信任发布 / provenance 签名必需（npm 据此向 GitHub 获取 OIDC token）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # 注意：不要设置 registry-url / NODE_AUTH_TOKEN —— OIDC 信任发布
          # 不使用 .npmrc 凭据，npm 会自动向 GitHub 请求 OIDC token 完成认证

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 防止误发布：标签版本必须与 package.json 版本一致
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Publishing geektime-tools@$VERSION"

      # 诊断：确认 id-token: write 生效。若缺失，npm 会静默跳过 OIDC 并报 ENEEDAUTH
      - name: Check OIDC environment
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC token request env: OK"
          else
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_* 环境变量缺失，请检查 workflow 的 permissions.id-token: write"
            exit 1
          fi

      # prepublishOnly（npm test 冒烟检查）会在 publish 前自动执行。
      # Trusted Publisher（OIDC）：npm 自动获取 OIDC token 认证 + provenance 签名，无需任何 Token。
      # 若仍报 ENEEDAUTH，用 --loglevel verbose 重跑，看 "oidc" 日志行：
      #   "Failed token exchange request with body message: ..." 即为 npmjs 拒绝交换的原因。
      - name: Publish to npm
        run: npm publish --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v4
        with:
          generate_release_notes: true
