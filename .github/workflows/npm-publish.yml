name: Publish to npm

# 触发方式：
# 1) 推送 v* 标签（推荐）：git tag v1.0.1 && git push origin v1.0.1
# 2) 手动：仓库 Actions 页面 → 本 workflow → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm provenance（发布来源签名）需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
        
      - name: Setup Node.js
        uses: actions/setup-node@v6 # @v6 已确认支持 OIDC 令牌
        with:
          node-version: 24
          # registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 防止误发布：标签版本必须与 package.json 版本一致
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Publishing geektime-tools@$VERSION"

      # prepublishOnly（npm test 冒烟检查）会在 publish 前自动执行
      # 已配置 npm Trusted Publisher（OIDC）：无需 NODE_AUTH_TOKEN / NPM_TOKEN 密钥，
      # npm CLI 通过 id-token: write 权限自动获取 OIDC token 完成认证与 provenance 签名
      - name: Publish to npm
        run: |
          # 清理可能干扰 OIDC 的残留配置
          npm config delete _authToken 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          # 使用最新版 npm 发布
          npx npm@latest publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: oidc

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v4
        with:
          generate_release_notes: true
